[flake8]
max-line-length = 350
max-complexity = 36
docstring-convention = google
per-file-ignores = __init__.py:F401
exclude = .git,
          __pycache__,
          setup.py,
          build,
          dist,
          docs,
          releases,
          .venv,
          .tox,
          .mypy_cache,
          .pytest_cache,
          .vscode,
          .github,

[mypy]
ignore_missing_imports = False
disallow_untyped_calls = True
disallow_untyped_defs = True
disallow_incomplete_defs = True
check_untyped_defs = True
